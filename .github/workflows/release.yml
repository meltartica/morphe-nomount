name: release

# A push to master publishes. The tag IS module.prop's version, so bumping the
# version publishes a new release and any other push updates the current one.
# `check` gates it, so a broken push never publishes.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The ZIP asset name must never change: the update button resolves
  # releases/latest/download/<asset>, which is only permanent while the name is
  # constant. Asserted below rather than trusted.
  ASSET: morphe-nomount.zip

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          for f in *.sh META-INF/com/google/android/update-binary; do
            sh -n "$f"
            echo "  ok  $f"
          done

      - name: No CR in shipped files
        run: |
          set -e
          # A CR anywhere in a shebang or a command silently breaks on Android.
          if grep -rlP '\r' module.prop customize.sh util.sh post-fs-data.sh service.sh META-INF; then
            echo "::error::CRLF found in the files above - Android shells cannot run them"
            exit 1
          fi
          echo "no CR in shipped files"

      - name: Module metadata
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          prop = {}
          for line in open('module.prop', encoding='utf-8'):
              line = line.strip()
              if line and not line.startswith('#') and '=' in line:
                  k, v = line.split('=', 1)
                  prop[k.strip()] = v.strip()

          for key in ('id', 'name', 'version', 'versionCode', 'author',
                      'description', 'updateJson'):
              if not prop.get(key):
                  sys.exit(f'::error::module.prop has no "{key}"')

          # KernelSU rejects the install outright if the id does not match.
          if not re.fullmatch(r'[a-zA-Z][a-zA-Z0-9._-]+', prop['id']):
              sys.exit(f"::error::id must match [a-zA-Z][a-zA-Z0-9._-]+: {prop['id']}")
          if not prop['versionCode'].isdigit():
              sys.exit(f"::error::versionCode must be an integer: {prop['versionCode']}")
          if '\n' in prop['description']:
              sys.exit('::error::description must be a single line')

          meta = json.load(open('update.json', encoding='utf-8'))
          for key in ('version', 'versionCode', 'zipUrl', 'changelog'):
              if not meta.get(key):
                  sys.exit(f'::error::update.json has no "{key}"')

          if meta['version'] != prop['version']:
              sys.exit(f"::error::version mismatch: module.prop={prop['version']} "
                       f"update.json={meta['version']}")
          if int(meta['versionCode']) != int(prop['versionCode']):
              sys.exit(f"::error::versionCode mismatch: module.prop={prop['versionCode']} "
                       f"update.json={meta['versionCode']}")

          # releases/latest/download/<asset> is only permanent while the asset
          # name is constant, so pin it.
          if not re.search(r'/releases/latest/download/[^/]+$', meta['zipUrl']):
              sys.exit(f"::error::zipUrl must end in releases/latest/download/<constant>: "
                       f"{meta['zipUrl']}")
          if not meta['zipUrl'].endswith('/' + os.environ['ASSET']):
              sys.exit(f"::error::zipUrl asset must be {os.environ['ASSET']}: "
                       f"{meta['zipUrl']}")

          print('module.prop and update.json agree')
          PY

  release:
    needs: check
    # PRs are checked but never published.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Full history, so the version-change check below can diff the push range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Should this push publish?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag=$(sed -n 's/^version=//p' module.prop | tr -d ' \r')

          # A version that has never been released always publishes. Gating on
          # module.prop alone is not enough: the push that introduced a version
          # may predate this workflow, or have been made while the workflow was
          # still tag-only, leaving the tag permanently unpublished.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag does not exist yet - will publish"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before='${{ github.event.before }}'
          zero='0000000000000000000000000000000000000000'
          if [ -z "$before" ] || [ "$before" = "$zero" ]; then
            # New branch, force push, or a manual run: no usable range, so publish.
            echo "no usable push range - will publish"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "$GITHUB_SHA" -- module.prop; then
            echo "module.prop unchanged and $tag already released - skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "module.prop changed - will publish"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tag from module.prop
        id: tag
        run: |
          set -e
          v=$(sed -n 's/^version=//p' module.prop | tr -d ' \r')
          [ -n "$v" ] || { echo "::error::module.prop has no version="; exit 1; }
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "release tag is $v"

      - name: Release notes from the newest CHANGELOG section
        run: |
          set -e
          # Everything under the first "## " heading, with the heading itself
          # stripped - the release title already carries the version.
          awk '
            /^## / { if (found) exit; found = 1; next }
            found  { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## ' section to use as release notes"
            exit 1
          fi
          echo "--- notes ---"
          cat RELEASE_NOTES.md

      - name: Build module ZIP
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          # git stores these as 100644 (core.filemode cannot see the bit on
          # Windows), but Magisk execs update-binary and the managers exec the
          # boot scripts. Set the bits here rather than trust the checkout.
          chmod +x customize.sh util.sh post-fs-data.sh service.sh \
                   META-INF/com/google/android/update-binary
          # Explicit file list. Everything at the ZIP root, which is what the
          # installer expects; repo scaffolding stays out.
          zip -r -X "dist/${ASSET}" \
            module.prop customize.sh util.sh post-fs-data.sh service.sh \
            LICENSE META-INF
          unzip -l "dist/${ASSET}"

      - name: Verify the ZIP
        run: |
          set -e
          unzip -Z1 "dist/${ASSET}" > /tmp/entries
          # module.prop must be at the ZIP root or the manager ignores the module
          grep -qx 'module.prop' /tmp/entries
          for f in customize.sh util.sh post-fs-data.sh service.sh; do
            grep -qx "$f" /tmp/entries
          done
          grep -qx 'META-INF/com/google/android/update-binary' /tmp/entries
          # no repo scaffolding may leak in
          if grep -qE '^(README\.md|CHANGELOG\.md|RELEASE_NOTES\.md|update\.json|\.gitignore|\.gitattributes|\.github/|dist/)' /tmp/entries; then
            echo "::error::repo scaffolding leaked into the module ZIP"
            grep -E '^(README\.md|CHANGELOG\.md|RELEASE_NOTES\.md|update\.json|\.gitignore|\.gitattributes|\.github/|dist/)' /tmp/entries
            exit 1
          fi
          # and the scripts inside it must be LF
          rm -rf /tmp/z && mkdir -p /tmp/z && unzip -q "dist/${ASSET}" -d /tmp/z
          if grep -rlP '\r' /tmp/z; then
            echo "::error::CRLF inside the packaged ZIP"
            exit 1
          fi
          echo "ZIP verified"

      - name: Publish
        # Only when this push touched module.prop, i.e. bumped the version. A
        # docs-only push must not churn the releases page.
        if: ${{ steps.ver.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          # An empty --notes-file silently BLANKS a release's notes, so guard it.
          [ -s RELEASE_NOTES.md ] || { echo "::error::RELEASE_NOTES.md is empty"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - updating asset and notes"
            gh release upload "$TAG" "dist/${ASSET}" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --latest
          else
            echo "creating release $TAG"
            gh release create "$TAG" "dist/${ASSET}" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          echo "--- published ---"
          # Informational only. The publish above already succeeded, and its own
          # exit code is the gate: a read-back that fails must never turn a
          # published release into a red build. Plain `gh release view` rather
          # than --json/--template - an invalid --json field name ("isLatest")
          # is what turned a successful publish red, and killed the release run.
          gh release view "$TAG" \
            || echo "(read-back unavailable; the release was published above)"
